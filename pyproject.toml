[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cto-legends"
version = "0.5.10"
description = "Discover, install, and maintain the cto-legends ecosystem with your agent."
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Benjamin Samar / cto-legends"}]
dependencies = []
readme = "README.md"

[project.scripts]
cto-legends = "cto_legends.cli:main"

[project.urls]
Homepage = "https://cto-legends.com"
Repository = "https://github.com/avalonreset/cto-legends"
Issues = "https://github.com/avalonreset/cto-legends/issues"

[tool.setuptools.packages.find]
include = ["cto_legends*"]

[tool.setuptools.package-data]
cto_legends = ["catalog.json", "SKILL.md"]
