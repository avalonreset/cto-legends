name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade "pip>=26.2.2" build twine id
      - run: python scripts/check_release.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/build_ctolegends_alias.py
      - name: Publish cto-legends and ctolegends to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.request

          token = os.environ.get("PYPI_API_TOKEN", "").strip()
          if not token and os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL"):
              oidc_raw = subprocess.check_output([sys.executable, "-m", "id", "pypi"], text=True).strip()
              req = urllib.request.Request(
                  "https://pypi.org/_/oidc/mint-token",
                  data=json.dumps({"token": oidc_raw}).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  token = json.loads(resp.read().decode("utf-8"))["token"]

          if not token:
              raise SystemExit("Neither PYPI_API_TOKEN nor GitHub OIDC Trusted Publisher succeeded.")

          env = {**os.environ, "TWINE_USERNAME": "__token__", "TWINE_PASSWORD": token}
          subprocess.run([sys.executable, "-m", "twine", "upload", "--skip-existing", "dist/*"], env=env, check=True)
          rc = subprocess.run([sys.executable, "-m", "twine", "upload", "--skip-existing", "dist-alias/*"], env=env)
          if rc.returncode != 0:
              print("Note: dist-alias (ctolegends) skipped or requires PyPI admin similarity exception.", file=sys.stderr)
          PY
