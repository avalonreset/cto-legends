name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  prime-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/cto-legends-archive-cache
          key: cto-legends-ci-archives-${{ hashFiles('cto_legends/catalog.json') }}
          restore-keys: |
            cto-legends-ci-archives-
      - name: Prime CI archive cache once per catalog pin
        env:
          CTO_LEGENDS_ARCHIVE_CACHE: ${{ runner.temp }}/cto-legends-archive-cache
        run: |
          python - <<'PY'
          from cto_legends import manager as m
          cat = m.catalog()
          for mod_id in (
              "legends-dataforseo",
              "legends-geogrid",
              "legends-github",
              "legends-stable-audio-3",
              "legends-obs",
              "legends-youtube",
              "legends-empire",
          ):
              row = cat["modules"][mod_id]
              url = (
                  row["artifact_url"]
                  if row.get("recipe", {}).get("source") == "release-tgz"
                  else f"https://codeload.github.com/{row['repo']}/zip/{row['commit']}"
              )
              m._fetch_verified_archive(url, {row["repo"]}, row["sha256"])
          print("CI archive cache primed.")
          PY

  test:
    needs: prime-cache
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/cto-legends-archive-cache
          key: cto-legends-ci-archives-${{ hashFiles('cto_legends/catalog.json') }}
          restore-keys: |
            cto-legends-ci-archives-
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_release.py
      - run: python -m pip install --upgrade "pip>=26.2.2" build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python cto_legends/_child_exec.py install-wheel dist
      - run: cto-legends route "Google Maps ranking grids"
      - run: python scripts/check_startup.py
      - run: cto-legends --home "${{ runner.temp }}/legends" install legends-dataforseo legends-geogrid legends-github legends-stable-audio-3 legends-obs legends-yt-dlp --apply
        env:
          CTO_LEGENDS_ARCHIVE_CACHE: ${{ runner.temp }}/cto-legends-archive-cache
      - run: cto-legends --home "${{ runner.temp }}/legends" doctor
      - run: cto-legends --home "${{ runner.temp }}/legends" check-updates
      - run: cto-legends --home "${{ runner.temp }}/legends" sync
      - run: python scripts/smoke_installed.py --home "${{ runner.temp }}/legends" --browser
      - run: cto-legends --home "${{ runner.temp }}/legends" run legends-geogrid -- --help
      - run: cto-legends --home "${{ runner.temp }}/legends" run legends-dataforseo -- routes
      - run: cto-legends --home "${{ runner.temp }}/legends" run legends-github -- capabilities
      - run: cto-legends --home "${{ runner.temp }}/legends" run legends-stable-audio-3 -- plan --hours 1 --vram-gb 16
      - run: cto-legends --home "${{ runner.temp }}/legends" run legends-obs -- manifest
      - run: cto-legends --home "${{ runner.temp }}/legends" run legends-yt-dlp -- --help
      - run: cto-legends guide legends-hyperyap
      - run: cto-legends guide hyperyap
      - run: cto-legends handoff hyperyap
      - run: cto-legends guide legends-captions
      - run: cto-legends guide legends-ultimate-captions
      - run: cto-legends handoff legends-ultimate-captions
      - run: cto-legends route "rip this video"
      - name: Install and verify Empire on its supported Python
        if: matrix.python == '3.13'
        env:
          CTO_LEGENDS_ARCHIVE_CACHE: ${{ runner.temp }}/cto-legends-archive-cache
        run: cto-legends --home "${{ runner.temp }}/legends" install legends-empire --apply
      - name: Check Empire portable surface
        if: matrix.python == '3.13'
        run: cto-legends --home "${{ runner.temp }}/legends" run legends-empire -- contracts --check-only
      - name: Check complete evidence handoff prerequisites
        if: matrix.python == '3.13'
        run: cto-legends --home "${{ runner.temp }}/legends" task-readiness evidence
      - run: python scripts/check_handoffs.py --home "${{ runner.temp }}/legends"
      - name: Register central skill in a disposable discovery directory
        run: cto-legends --home "${{ runner.temp }}/legends" agent-setup codex --directory "${{ runner.temp }}/skills" --apply
