name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install .
      - run: cto-legends route "Google Maps ranking grids"
      - run: cto-legends --home "${{ runner.temp }}/legends" install legends-dataforseo-kit legends-geogrid legends-github --apply
      - run: cto-legends --home "${{ runner.temp }}/legends" doctor
      - run: cto-legends --home "${{ runner.temp }}/legends" run legends-geogrid -- --help
      - run: cto-legends --home "${{ runner.temp }}/legends" run legends-dataforseo-kit -- routes
      - run: cto-legends --home "${{ runner.temp }}/legends" run legends-github -- capabilities
