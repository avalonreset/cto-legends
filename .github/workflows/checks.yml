name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/cto_legends-0.5.4-py3-none-any.whl
      - run: cto-legends route "Google Maps ranking grids"
      - run: python scripts/check_startup.py
      - run: cto-legends --home "${{ runner.temp }}/legends" install legends-dataforseo-kit legends-geogrid legends-github legends-stable-audio-3 legends-obs-kit --apply
      - run: cto-legends --home "${{ runner.temp }}/legends" doctor
      - run: python scripts/smoke_installed.py --home "${{ runner.temp }}/legends" --browser
      - run: cto-legends --home "${{ runner.temp }}/legends" run legends-geogrid -- --help
      - run: cto-legends --home "${{ runner.temp }}/legends" run legends-dataforseo-kit -- routes
      - run: cto-legends --home "${{ runner.temp }}/legends" run legends-github -- capabilities
      - run: cto-legends --home "${{ runner.temp }}/legends" run legends-stable-audio-3 -- plan --hours 1 --vram-gb 16
      - run: cto-legends --home "${{ runner.temp }}/legends" run legends-obs-kit -- manifest
      - run: cto-legends guide hyperyap
      - run: cto-legends guide legends-obs-cursor
      - name: Install and verify Obsidian on its supported Python
        if: matrix.python == '3.13'
        run: cto-legends --home "${{ runner.temp }}/legends" install legends-obsidian --apply
      - name: Check Obsidian portable surface
        if: matrix.python == '3.13'
        run: cto-legends --home "${{ runner.temp }}/legends" run legends-obsidian -- contracts --check-only
      - name: Check complete evidence handoff prerequisites
        if: matrix.python == '3.13'
        run: cto-legends --home "${{ runner.temp }}/legends" task-readiness evidence
      - run: python scripts/check_handoffs.py --home "${{ runner.temp }}/legends"
      - name: Register central skill in a disposable discovery directory
        run: cto-legends --home "${{ runner.temp }}/legends" agent-setup codex --directory "${{ runner.temp }}/skills" --apply
